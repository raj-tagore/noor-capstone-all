<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CureWell</title>
  <!--
    Base href tells the router that app URLs start at the site root,
    so /viewSurgery and /editSurgery resolve correctly.
  -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <!--
    AppComponent's selector (app.component.ts). main.ts starts
    AppModule, which bootstraps that component into this tag.
    Everything else, the navbar and the two surgery pages, is rendered
    from app.component.html inside here.
  -->
  <app-root></app-root>
</body>
</html>
