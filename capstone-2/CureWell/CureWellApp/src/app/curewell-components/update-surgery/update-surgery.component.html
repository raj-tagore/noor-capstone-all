<div class="myContent">
  <div class="container">
    
    <h2 align="justify" style="color:brown">Update Surgery</h2>
    <form #updateSurgeryForm="ngForm">
      <div class="row">
        <div class="col-md-4">
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <div class="col" style="text-align:left">
              <label>Surgery Id</label>
            </div>
            <div class="col; input-group">
              <input type="text" name="surgeryId" class="form-control qkinput" id="surgeryID">
            </div>
          </div>
          <div class="form-group">
            <div class="col" style="text-align:left">
              <label>Doctor Id</label>
            </div>
            <div class="col; input-group">
              <input type="text" name="doctorId" class="form-control qkinput" id="doctorID">
            </div>
          </div>

          <div class="form-group">
            <div class="col" style="text-align:left">
              <label>Surgery Date</label>
            </div>
            <div class="col; input-group">
              <input type="text" name="surgeryDate" class="form-control qkinput" id="surgeryDate">
            </div>
          </div>

          <div class="form-group">
            <div class="col" style="text-align:left">
              <label>Start Time(24 Hours Format)</label>
            </div>
            <div class="col; input-group">
              <input type="text" name="starttime" class="form-control qkinput" id="starttime">
              <!--Add your logic here-->
            </div>
          </div>

          <div class="form-group">
            <div class="col" style="text-align:left">
              <label>End Time(24 Hours Format)</label>
            </div>
            <div class="col; input-group">
              <input type="text" name="endtime" class="form-control qkinput" id="endtime">
              <!--Add your logic here-->
            </div>
          </div>

          <div class="form-group">
            <div class="col" style="text-align:left">
              <label>Surgery Category</label>
            </div>
            <div class="col; input-group">
              <input type="text" name="surgeryCategory" class="form-control qkinput" id="surgeryCategory">
            </div>
          </div>

          <div class="form-group" style="text-align:left">
            <!--Add your logic here-->
          </div>
        </div>
        <div class="col-md-4">
        </div>
      </div>
    </form>
  </div>
</div>
