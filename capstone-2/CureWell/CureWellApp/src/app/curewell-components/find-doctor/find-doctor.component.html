<h2 align="center">Find a Doctor</h2>

<form align="center" #byIdForm="ngForm" (ngSubmit)="getById(doctorId)">
  <label>Doctor Id</label>
  <input type="number" id="find_doctorId" name="doctorId" [(ngModel)]="doctorId">
  <button class="btn" type="submit">Find by id</button>
</form>

<br />

<form align="center" #byEmailForm="ngForm" (ngSubmit)="getByEmail(email)">
  <label>Email</label>
  <input type="email" id="find_email" name="email" [(ngModel)]="email" placeholder="albert@curewell.com">
  <button class="btn" type="submit">Find by email</button>
</form>
